name: Feature Request
description: Suggest a new feature or improvement
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      placeholder: I forget which customers I texted vs. which I haven't.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      placeholder: Add a "Not Texted" filter to the dashboard.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy review
      options:
        - label: This feature does NOT send customer data to any external service
        - label: This feature does NOT auto-send SMS without user confirmation
        - label: This feature preserves the existing localStorage schema (additive only)
