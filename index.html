<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <title>Follow-Up CRM</title>
    <meta name="description" content="Customer follow-up tracker. Local-first, privacy-respecting." />

    <!-- Theme + favicon -->
    <meta name="theme-color" content="#0f0f13" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS-specific PWA tags (Safari ignores manifest icons, needs these) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Follow-Up" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Prevent phone-number auto-detection in iOS Safari (we control phone display) -->
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
